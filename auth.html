<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Hay - Đăng Ký & Đăng Nhập</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .auth-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 14px; color: #007bff; cursor: pointer; }
        .message { text-align: center; color: red; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="form-title">Đăng Ký Tài Khoản</h2>
    <input type="email" id="email" placeholder="Nhập Gmail của bạn" required>
    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
    <button id="auth-btn" onclick="handleAuth()">Đăng Ký</button>
    <div class="toggle-link" id="toggle-auth" onclick="toggleForm()">Bạn đã có tài khoản? Đăng nhập ngay</div>
    <div class="message" id="msg-box"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        sendEmailVerification 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Cấu hình Firebase cá nhân của bạn
    const firebaseConfig = {
        apiKey: "AIzaSyA4OWmZHVfLsO9fRr9jlE1nitbBQXb_jVk",
        authDomain: "hochay-552d1.firebaseapp.com",
        projectId: "hochay-552d1",
        storageBucket: "hochay-552d1.firebasestorage.app",
        messagingSenderId: "1054448039168",
        appId: "1:1054448039168:web:ccfab22aaeafa3933befe5",
        measurementId: "G-X1Z4HW5F5N"
    };

    // Khởi tạo Firebase và dịch vụ Auth
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isLoginMode = false; // Trạng thái form: false = Đăng ký, true = Đăng nhập

    // Hàm chuyển đổi qua lại giữa giao diện Đăng ký và Đăng nhập
    window.toggleForm = function() {
        isLoginMode = !isLoginMode;
        const title = document.getElementById('form-title');
        const btn = document.getElementById('auth-btn');
        const toggle = document.getElementById('toggle-auth');
        document.getElementById('msg-box').innerText = '';

        if (isLoginMode) {
            title.innerText = "Đăng Nhập";
            btn.innerText = "Đăng Nhập";
            btn.style.background = "#007bff";
            toggle.innerText = "Chưa có tài khoản? Đăng ký tại đây";
        } else {
            title.innerText = "Đăng Ký Tài Khoản";
            btn.innerText = "Đăng Ký";
            btn.style.background = "#28a745";
            toggle.innerText = "Bạn đã có tài khoản? Đăng nhập ngay";
        }
    }

    // Hàm xử lý chính khi bấm nút
    window.handleAuth = async function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msgBox = document.getElementById('msg-box');
        msgBox.innerText = '';

        if (!email || !password) {
            msgBox.style.color = "red";
            msgBox.innerText = "Vui lòng nhập đầy đủ thông tin!";
            return;
        }

        try {
            if (isLoginMode) {
                // XỬ LÝ ĐĂNG NHẬP
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Kiểm tra xem người dùng đã bấm vào link xác nhận trong Gmail chưa
                if (!user.emailVerified) {
                    msgBox.style.color = "orange";
                    msgBox.innerText = "Tài khoản chưa kích hoạt! Vui lòng kiểm tra Gmail để xác nhận.";
                    return;
                }

             msgBox.style.color = "green";
msgBox.innerText = "Đăng nhập thành công!";

// Chuyển hướng ngay lập tức sang trang chủ index.html
window.location.href = "index.html";

            } else {
                // XỬ LÝ ĐĂNG KÝ + TỰ ĐỘNG GỬI EMAIL XÁC NHẬN (2FA)
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                // Gửi email xác nhận link kích hoạt tài khoản
                await sendEmailVerification(userCredential.user);

                msgBox.style.color = "green";
                msgBox.innerText = "Đăng ký thành công! Một email xác nhận đã được gửi đến hộp thư của bạn.";
                
                // Trả về trạng thái đăng nhập để họ chờ kích hoạt
                setTimeout(() => { toggleForm(); }, 3000);
            }
        } catch (error) {
            msgBox.style.color = "red";
            // Việt hóa một số lỗi cơ bản từ Firebase
            if (error.code === 'auth/email-already-in-use') msgBox.innerText = "Gmail này đã được đăng ký trước đó.";
            else if (error.code === 'auth/weak-password') msgBox.innerText = "Mật khẩu quá yếu (tối thiểu phải 6 ký tự).";
            else if (error.code === 'auth/invalid-email') msgBox.innerText = "Định dạng Gmail không hợp lệ.";
            else if (error.code === 'auth/invalid-credential') msgBox.innerText = "Sai Gmail hoặc mật khẩu.";
            else msgBox.innerText = "Lỗi: " + error.message;
        }
    }
</script>

</body>
</html>
